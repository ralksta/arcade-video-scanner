<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Scanner Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Design-System-Tokens. Diese Seite wird standalone ausgeliefert (ohne
           den <head> aus templates/ui_components.py) und muss die Werte daher
           selbst mitbringen. Quelle der Wahrheit bleibt templates/theme.py —
           tests/test_login_tokens.py haelt beide Seiten deckungsgleich. */
        :root {
            --ds-bg: #0b0b10;
            --ds-surface: #15151d;
            --ds-border: #2a2a35;
            --ds-text: #f2f2f5;
            --ds-text-muted: #6b6b76;
            --ds-accent: #c4179f;
            --ds-accent-hover: #e34fc0;
            --ds-danger: #f36969;
            --ds-hairline-strong: rgba(255,255,255,0.12);
            color-scheme: dark;
        }

        body {
            background-color: var(--ds-bg);
            color: var(--ds-text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        .login-card {
            background: var(--ds-surface);
            border: 1px solid var(--ds-hairline-strong);
            padding: 32px;
            border-radius: 10px;
            width: 100%;
            max-width: 320px;
        }

        .wordmark {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .wordmark-dot {
            width: 7px;
            height: 7px;
            border-radius: 2px;
            background: var(--ds-accent);
        }

        h1 {
            margin: 0;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: -0.01em;
            color: var(--ds-text);
        }

        .subtitle {
            font-size: 12px;
            color: var(--ds-text-muted);
            margin: 0 0 20px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 9px 12px;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--ds-hairline-strong);
            border-radius: 6px;
            color: var(--ds-text);
            box-sizing: border-box;
            font-family: inherit;
            font-size: 13px;
            transition: border-color .15s ease;
        }

        input::placeholder {
            color: var(--ds-text-muted);
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--ds-accent);
        }

        button {
            width: 100%;
            padding: 9px 16px;
            background: var(--ds-accent);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color .15s ease;
        }

        button:hover {
            background: var(--ds-accent-hover);
        }

        .error {
            color: var(--ds-danger);
            margin-top: 12px;
            font-size: 12px;
            display: none;
        }

        .remember-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
        }

        .remember-row input[type="checkbox"] {
            width: 15px;
            min-width: 15px;
            height: 15px;
            padding: 0;
            margin: 0;
            accent-color: var(--ds-accent);
            cursor: pointer;
        }

        .remember-row label {
            font-size: 12px;
            color: var(--ds-text-muted);
            cursor: pointer;
            user-select: none;
        }

        :focus-visible {
            outline: 2px solid rgba(196,23,159,0.7);
            outline-offset: 2px;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="wordmark">
            <span class="wordmark-dot"></span>
            <h1>Arcade Scanner</h1>
        </div>
        <p class="subtitle">Sign in to your library.</p>

        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required autocomplete="username">
            <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
            <div class="remember-row">
                <input type="checkbox" id="rememberMe" checked>
                <label for="rememberMe">Remember me (30 days)</label>
            </div>
            <button type="submit">Sign in</button>
        </form>
        <div id="errorMsg" class="error">Invalid credentials</div>
    </div>

    <script>
        // Login Logic
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const remember = document.getElementById('rememberMe').checked;
            const err = document.getElementById('errorMsg');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p, remember: remember })
                });

                if (res.ok) {
                    const params = new URLSearchParams(window.location.search);
                    const dest = params.get('redirect') || '/';
                    window.location.href = dest;
                } else if (res.status === 429) {
                    err.innerText = 'Too many attempts. Try again in 15 minutes.';
                    err.style.display = 'block';
                } else {
                    err.style.display = 'block';
                }
            } catch (e) {
                err.innerText = "Connection error";
                err.style.display = 'block';
            }
        });
    </script>
</body>

</html>
