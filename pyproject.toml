[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arcade_scanner"
version = "4.9.0"
authors = [
  { name="Ralksta", email="ralksta@users.noreply.github.com" },
]
description = "A professional-grade modular Arcade Media Scanner with a polished Web UI."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "ruff>=0.4",
    "mypy>=1.0",
]
# GPU embedding indexer (scripts/media_indexer.py) — NEVER a server runtime dep
indexer = [
    "torch>=2.0",
    "open_clip_torch>=2.24",
]

[project.scripts]
arcade-scanner = "arcade_scanner.main:run_scanner"

[tool.setuptools.packages.find]
where = ["."]
include = ["arcade_scanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
# Seit Ruff 0.2 gehören select/ignore unter [tool.ruff.lint]; als Top-Level-
# Schlüssel wirkten sie zwar weiter, gaben aber bei jedem Lauf eine
# Deprecation-Warnung aus.
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pydantic-mypy]
warn_untyped_fields = true

# numpy is only a transitive dependency (via ImageHash/PIL) and is not used
# directly in arcade_scanner. Its bundled stubs use the PEP 695 `type`
# statement, which mypy rejects when parsed at our target python_version.
# Skip following numpy imports so its stubs are not type-checked.
[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
